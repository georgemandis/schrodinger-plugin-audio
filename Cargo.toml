[package]
name = "schrodinger-plugin-audio"
version = "0.1.0"
edition = "2021"
description = "Text to speech and audio/video transcripts for Schrödinger"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
schrodinger-plugin-sdk = { git = "https://github.com/georgemandis/schrodinger-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
libc = "0.2"
whatlang = "0.16"

[dev-dependencies]
tempfile = "3"
